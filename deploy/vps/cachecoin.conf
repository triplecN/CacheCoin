# ==============================================================================
# CacheCoin VPS seed / relay node  (installed as /etc/cachecoin/cachecoin.conf)
# ==============================================================================
# Role: keep the full chain online 24/7 and relay blocks/transactions.
# This node does NOT mine (many VPS providers forbid mining).
#
# Default mode: Tor only. The node is reachable only through its .onion address
# and never uses the VPS IP for peer-to-peer traffic.

server=1
txindex=1

# ---- Tor only --------------------------------------------------------------
# All outgoing connections go through the local Tor daemon.
proxy=127.0.0.1:9050
onlynet=onion
# Publish this node as a Tor onion service (key kept in the datadir as
# onion_v3_private_key -> back it up to keep the same .onion address).
listen=1
listenonion=1
torcontrol=127.0.0.1:9051
# Listen on localhost only; the public interface is never opened.
bind=127.0.0.1:29333
bind=127.0.0.1:29334=onion

# No discovery through clearnet mechanisms.
dnsseed=0
discover=0
upnp=0
natpmp=0

# ---- Optional: also accept clearnet peers -------------------------------------
# Better reachability for people without Tor, but it publishes this VPS's IP.
# To enable: comment out "onlynet=onion" and the first "bind=" above, then add
#   bind=0.0.0.0:29333
# and open TCP port 29333 in the firewall.

# ---- RPC: local only, cookie authentication ------------------------------------
# No rpcuser/rpcpassword: cachecoin-cli reads the .cookie file in the datadir.
rpcbind=127.0.0.1
rpcallowip=127.0.0.1

# ---- Resources (1-2 GB RAM VPS) -----------------------------------------------
dbcache=300
maxmempool=150
maxconnections=64
disablewallet=1
