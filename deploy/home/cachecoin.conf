# ==============================================================================
# CacheCoin home mining node  (copy to ~/.cachecoin/cachecoin.conf)
# ==============================================================================
# Role: mine blocks at home AND serve as a peer, so the network does not depend
# on one seed server. This is the whole package in one process:
#   node + peer (accepts incoming Tor connections) + miner (deploy/home/mine.sh).
# Privacy: every connection goes through Tor, so peers never see your home IP.
# The node does publish its own .onion address and accepts incoming connections.

server=1
# Full transaction index (lets this node serve old raw transactions; needs disk
# space and a reindex on existing datadirs, so keep it from the first start).
txindex=1

# ---- Tor only -----------------------------------------------------------------
proxy=127.0.0.1:9050
onlynet=onion
# Bootstrap: the published seeds. Add more addnode= lines as the network grows;
# the node also learns addresses from its peers and stores them in addrman.
addnode=ag7rydtma6dt5fonz76sdbecrbugq3uln7cc6ddvg2c2jngio4lw6mid.onion:29333
addnode=7uodchunfsykltytzwhpq6plvlxsulhtawjisrvcxzhljfdsmwnjbead.onion:29333

# ---- Peer: publish an onion service and accept incoming connections ------------
# The node asks Tor (control port, cookie authentication) for its own .onion
# address, so other nodes can sync from this one. Binds are loopback only: no
# router or firewall change is needed. See deploy/README.md for the Tor setup
# (ControlPort + CookieAuthentication in /etc/tor/torrc).
listen=1
listenonion=1
torcontrol=127.0.0.1:9051
bind=127.0.0.1:29333
bind=127.0.0.1:29334=onion

dnsseed=0
discover=0
natpmp=0

# ---- Shunko: payments are never announced by this node ------------------------
# The wallet never broadcasts (or rebroadcasts) its own transactions, which would
# mark this node as their origin. Send with scripts/sendtoshunko.sh instead: it
# hands each payment to other nodes over one-shot Tor connections.
walletbroadcast=0

# Fee fallback (10 sat/vB), so scripts/sendtoshunko.sh can build the payment on a
# young chain. That script passes no fee arguments, so without this the wallet
# refuses to sign and the script only reports a generic signing failure. This is
# a floor for when no fee history exists, not a price; it is ignored once real
# fee data accumulates.
fallbackfee=0.0001

# ---- RPC: local only, cookie authentication (no password in this file) --------
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
# mine.sh keeps one RPC call running per mining loop (10-15 s each). Allow more RPC
# threads than mining loops so other commands (getblockchaininfo, the wallet,
# sendtoshunko.sh) still get an answer while it mines.
rpcthreads=8

# ---- Resources ---------------------------------------------------------------
dbcache=300
maxmempool=150
# A home node serves other peers, but with a bound so mining and browsing stay
# smooth: at most 32 connections and about 5 GB served per day.
maxconnections=32
maxuploadtarget=5000
