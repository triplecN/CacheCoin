# ==============================================================================
# CacheCoin home mining node  (copy to ~/.cachecoin/cachecoin.conf)
# ==============================================================================
# Role: mine blocks at home and hand them to your own VPS seed node.
# Privacy: every connection goes through Tor, and only to your VPS, so peers never
# see your home IP. The node does not accept incoming connections.

server=1
# Full transaction index (lets this node serve old raw transactions; needs disk
# space and a reindex on existing datadirs, so keep it from the first start).
txindex=1

# ---- Tor only, one peer: your VPS ---------------------------------------------
proxy=127.0.0.1:9050
onlynet=onion
# Replace with the address printed by deploy/vps/setup_vps.sh
connect=REPLACE_WITH_YOUR_VPS_ONION_ADDRESS.onion:29333
listen=0
listenonion=0
dnsseed=0
discover=0
upnp=0
natpmp=0

# ---- Shunko: payments are never announced by this node ------------------------
# The wallet never broadcasts (or rebroadcasts) its own transactions, which would
# mark this node as their origin. Send with scripts/sendtoshunko.sh instead: it
# hands each payment to other nodes over one-shot Tor connections.
walletbroadcast=0

# Fee fallback (10 sat/vB), so scripts/sendtoshunko.sh can build the payment on a
# young chain. That script passes no fee arguments, so without this the wallet
# refuses to sign and the script only reports a generic signing failure. This is
# a floor for when no fee history exists, not a price; it is ignored once real
# fee data accumulates.
fallbackfee=0.0001

# ---- RPC: local only, cookie authentication (no password in this file) --------
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
# mine.sh keeps one RPC call running per mining loop (10-15 s each). Allow more RPC
# threads than mining loops so other commands (getblockchaininfo, the wallet,
# sendtoshunko.sh) still get an answer while it mines.
rpcthreads=8

# ---- Resources ---------------------------------------------------------------
dbcache=300
maxmempool=150
