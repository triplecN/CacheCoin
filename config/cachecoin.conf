# ==============================================================================
# CacheCoin (CCCN) node configuration  (copy to ~/.cachecoin/cachecoin.conf)
# ==============================================================================
# For a Tor-only VPS seed node or a home miner behind Tor, use the templates in
# deploy/vps/ and deploy/home/ instead.

server=1
txindex=1

# P2P: Tor-only by default (this coin has no clearnet seeds, and Shunko assumes
# a proxy: without one your IP is visible to every peer you connect to).
proxy=127.0.0.1:9050
onlynet=onion
listen=1
bind=127.0.0.1:29333
# A second bind tagged =onion: point your hidden service at 29334 so inbound
# Tor peers are recognised as onion (see deploy/vps/). Without the tag they are
# treated as clearnet and Shunko's inbound exclusion cannot recognise them.
bind=127.0.0.1:29334=onion
port=29333
maxconnections=64
dnsseed=0
discover=0
# Peers to connect to at startup (no DNS seeds exist). Example:
# addnode=<seed-node>.onion:29333
# To run clearnet anyway (NOT recommended: deanonymizes you), comment the proxy /
# onlynet / bind lines above and read the WARNING below.
# WARNING: clearnet addnode entries expose your IP to those peers.
# addnode=203.0.113.10:29333

# JSON-RPC: local only. Authentication uses the .cookie file that cachecoind writes
# into the data directory, so no password has to be stored here.
rpcbind=127.0.0.1
rpcallowip=127.0.0.1

# Wallet fee fallback (10 sat/vB).
# This is not a price. It is a last-resort floor used only when the fee estimator
# has no data to work from, which is the normal state of a young chain. Without
# it the wallet refuses to build a transaction at all and reports "Fee estimation
# failed. Fallbackfee is disabled." Once real fee history exists this setting is
# ignored and normal estimation takes over.
fallbackfee=0.0001

# Resources (4 GB consumer PC)
dbcache=450
maxmempool=150
