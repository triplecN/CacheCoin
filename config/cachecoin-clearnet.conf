# ==============================================================================
# CacheCoin (CCCN) node configuration - CLEARNET (no Tor)
# ==============================================================================
# Copy to your data directory as cachecoin.conf:
#     Linux/macOS : ~/.cachecoin/cachecoin.conf
#     Windows     : only for a node you start yourself. The CacheCoin launcher
#                   enforces Tor-only and refuses a public bind=; do not copy
#                   this into a launcher-managed %APPDATA%\CacheCoin.
#
# WHAT THIS IS
#   The default config/cachecoin.conf is Tor-only. This file is the same node
#   without Tor, for people who do not need network-origin privacy and would
#   rather not install and keep Tor running.
#
# WHAT IT COSTS YOU
#   Your IP address is visible to every peer you connect to. Anyone watching
#   the network can tell which node is yours. Tor exists to stop exactly that,
#   so this is a real trade, not a free option.
#
# WHAT YOU GIVE UP
#   Shunko (transaction relay with hidden origin) needs Tor and will refuse to
#   run under this config. It is not needed for anything else: normal
#   sendtoaddress still works and still broadcasts, because walletbroadcast is
#   left at its default here.
#
# PEERS
#   This chain has no DNS seeds, so a fresh node has nobody to talk to. Add at
#   least one peer by hand, or your node will sit at zero connections forever
#   without printing an error. Ask whoever gave you this file for an address.
#
# For a Tor-only seed node or a home miner behind Tor, use the templates in
# deploy/vps/ and deploy/home/ instead. Those are the recommended setups.

server=1
txindex=1

# ---- P2P: clearnet -------------------------------------------------------
# No proxy=, no onlynet=onion. That is the entire difference from the default
# config. These are network settings only: no consensus rule reads them, so the
# chain you end up on is identical either way.
listen=1
# Listen on all interfaces so other nodes can reach you. The default config
# binds to 127.0.0.1, which would make this node unreachable to anyone.
# This opens TCP 29333 to the internet; open it in your firewall.
bind=0.0.0.0:29333
port=29333
maxconnections=64
# No DNS seeds exist for this chain, so this would be meaningless either way.
dnsseed=0
# No automatic peer discovery. Peers are added by hand below, so your node
# connects to exactly who you list and nothing else.
discover=0
# Peers to connect to at startup. At least one is required. Repeat the line to
# add more than one.
# addnode=<peer-ip>:29333

# ---- JSON-RPC: local only ------------------------------------------------
# Never change these to a public address. RPC is administrative: whoever can
# reach it can move coins, rescan the chain and stop the node. The .cookie file
# the node writes in your data directory is the only credential needed.
rpcbind=127.0.0.1
rpcallowip=127.0.0.1

# ---- Wallet: fee fallback (10 sat/vB) --------------------------------------
# Same setting and same reason as the default config: a last-resort floor for a
# chain with no fee history, not a price. Without it the wallet refuses to
# build a transaction. Ignored once real fee data exists.
fallbackfee=0.0001

# ---- Resources (4 GB consumer PC) ---------------------------------------
dbcache=450
maxmempool=150
