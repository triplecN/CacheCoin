name: build-and-test

# The Linux job mirrors
# scripts/build_linux.sh + tests/ one-to-one. The ARM64 job repeats the consensus
# suites there, because RandomX has separate ARM64 code paths and consensus must
# not depend on the architecture. The Windows job builds the .exe files so a
# release can attach them when it chooses to (release.yml decides what is
# attached; the Windows binaries stay outside the Linux suites). Checksums are
# SHA-256 (never MD5: MD5 is broken for integrity purposes).

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Least privilege: this workflow only ever reads the repository. The default token
# permissions can include contents: write, and actions/checkout leaves the token in
# .git/config where the following build steps can read it.
permissions:
  contents: read

# Several suites on RandomX nodes are slow. Without this, successive pushes stack runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build cachecoind + cachecoin-cli
        run: bash scripts/build_linux.sh
      - name: Emission schedule self-check (no node needed)
        run: python3 scripts/check_supply.py --check
      - name: Reserve ephemeral ports used by the suites
        # The suites bind fixed ports (29333/29334, 39xxx). Linux may otherwise
        # hand the same ports to an outgoing connection as ephemeral ports,
        # which makes a node's RPC/P2P bind fail at random.
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=29333-29334,39000-39999
      - name: Regression suites (throw-away datadirs, never mainnet)
        env:
          KEEP_DATADIRS: "1"
        run: |
          BIN="$(command -v cachecoind)"
          python3 -u tests/functional_regtest.py "$BIN"
          python3 -u tests/per_regtest.py "$BIN"
          python3 -u tests/shunko_regtest.py "$BIN"
          python3 -u tests/p2p_dos_regtest.py "$BIN"
          python3 -u tests/explorer_regtest.py "$BIN"
          python3 -u tests/mainnet_smoke.py "$BIN"
          python3 -u tests/durability_regtest.py "$BIN"
          python3 -u tests/per_invariants.py "$BIN"
          python3 -u tests/per_adversarial_regtest.py "$BIN"
          python3 -u tests/wallet_reorg_regtest.py "$BIN"
          python3 -u tests/soak_regtest.py "$BIN"
          python3 -u tests/swap_scripts_regtest.py "$BIN"
          python3 -u tests/watcher_conformance_regtest.py "$BIN"
          # These two read the SOURCE TREE, not just the installed binary, so they
          # need the path build_linux.sh cloned into (SRC_DIR).
          python3 -u tests/emission_check.py "$BIN" "$HOME/cachecoin-build/cachecoin-v31.1"
          bash tests/lwma_check.sh "$HOME/cachecoin-build/cachecoin-v31.1"
      - name: Upload test datadirs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-test-datadirs
          path: /tmp/cachecoin-*
          if-no-files-found: ignore
      - name: Genesis reproduction (no node needed)
        run: python3 scripts/reproduce_genesis.py

  linux-arm64-build-test:
    # Cross-architecture determinism: aarch64 must reproduce the same genesis
    # digest and accept the same chains as x86-64. build_linux.sh already runs
    # upstream RandomX test vectors as a build gate; this repeats the consensus
    # suites on ARM. GitHub's ARM64 runners are free for public repositories; on a
    # private repository, drop this job or switch it to a manual trigger.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build cachecoind + cachecoin-cli (aarch64)
        run: bash scripts/build_linux.sh
      - name: Genesis arithmetic (Python; the node self-test runs in the suites)
        run: python3 scripts/reproduce_genesis.py
      - name: Reserve ephemeral ports used by the suites
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=29333-29334,39000-39999
      - name: Consensus suites
        run: |
          BIN="$(command -v cachecoind)"
          python3 -u tests/functional_regtest.py "$BIN"
          python3 -u tests/per_regtest.py "$BIN"
          python3 -u tests/per_invariants.py "$BIN"
          python3 -u tests/emission_check.py "$BIN" "$HOME/cachecoin-build/cachecoin-v31.1"
          # lwma_check.sh compiles against the source tree build_linux.sh cloned.
          bash tests/lwma_check.sh "$HOME/cachecoin-build/cachecoin-v31.1"

  windows-build:
    # Produces cachecoind.exe + cachecoin-cli.exe for newcomers.
    # Follows doc/build-windows.md (MSYS2/MINGW64) plus the CacheCoin steps
    # from scripts/build_linux.sh: pin check -> apply the patch series in order ->
    # build pinned RandomX -> build node binaries -> SHA256SUMS.
    #
    # Required, like the Linux jobs: the Windows binaries are a release input,
    # and a red Windows job must fail the run. The artifact is only uploaded
    # when the build, the static-runtime assertion and the clean-PATH wallet test all pass.
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake mingw-w64-x86_64-boost
            mingw-w64-x86_64-libevent mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-zeromq python
      - name: Clone pinned sources
        run: |
          # Git for Windows defaults to core.autocrlf=true, which turns the source
          # into CRLF on checkout; `git apply --index` then fails with "does not
          # match index" on the first patch that touches a file. Force LF so the
          # Windows job applies exactly the same bytes as the Linux job.
          git config --global core.autocrlf false
          git config --global core.eol lf
          git clone --branch v31.1 --depth 1 https://github.com/bitcoin/bitcoin.git /c/b
          cd /c/b
          test "$(git rev-parse 'v31.1^{commit}')" = "9be056a8a72b624dae9623b2f7bded92c2a21c91"
          git clone https://github.com/tevador/RandomX.git src/crypto/randomx
          git -C src/crypto/randomx checkout --quiet 7607fb2faed24d5a679e139a9828d194bbc644a4
          test "$(git -C src/crypto/randomx rev-parse HEAD)" = "7607fb2faed24d5a679e139a9828d194bbc644a4"
      - name: Apply CacheCoin patches in order
        run: |
          cd /c/b
          for p in "$GITHUB_WORKSPACE/patches/"*.patch; do
            echo "-> $(basename $p)"
            git apply --index "$p"
          done
          if grep -rIn --exclude-dir=.git -e '^<<<<<<< ' -e '^>>>>>>> ' src/; then
            echo "conflict markers found in the patched tree"; exit 1
          fi
      - name: Build RandomX + node
        # RandomX is built out of tree first, then consumed by the node build as a
        # prebuilt librandomx.a. RandomX's own CMakeLists installs a library and builds
        # three executables, so it is not pulled in with add_subdirectory.
        run: |
          mkdir -p /c/b/src/crypto/randomx/build
          cd /c/b/src/crypto/randomx/build
          cmake -DARCH=default -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ..
          cmake --build . -j4
          ./randomx-tests > randomx-tests.log && tail -1 randomx-tests.log
          cd /c/b
          # Link SQLite statically: hide the import library so CMake resolves
          # libsqlite3.a instead of libsqlite3.dll.a. The package must not carry
          # libsqlite3-0.dll; the assert step below fails if any non-system
          # dependency reappears.
          if [ -f /mingw64/lib/libsqlite3.dll.a ]; then
            mv /mingw64/lib/libsqlite3.dll.a /mingw64/lib/libsqlite3.dll.a.hidden
          fi
          # Sanitize the build: remove absolute build paths from strings, strip
          # the executables and omit the PE timestamp (both set 1970-01-01).
          MAPS="-ffile-prefix-map=C:/msys64/mingw64/include= -ffile-prefix-map=/mingw64/include= -ffile-prefix-map=C:/b=/b -ffile-prefix-map=/c/b=/b -fmacro-prefix-map=C:/msys64/mingw64/include= -fmacro-prefix-map=/mingw64/include= -fmacro-prefix-map=C:/b=/b -fmacro-prefix-map=/c/b=/b"
          cmake -B build -DCACHECOIN_RANDOMX_ROOT=/c/b/src/crypto/randomx \
            -DBUILD_TESTS=OFF -DBUILD_BENCH=OFF -DBUILD_FUZZ_BINARY=OFF -DBUILD_GUI=OFF \
            -DBUILD_KERNEL_LIB=OFF -DBUILD_BITCOIN_BIN=OFF -DENABLE_WALLET=ON \
            -DENABLE_IPC=OFF -DWITH_ZMQ=OFF -DWITH_USDT=OFF \
            -DCMAKE_CXX_FLAGS="$MAPS" -DCMAKE_C_FLAGS="$MAPS" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,-s -Wl,--no-insert-timestamp"
          cmake --build build -j4 --target bitcoind bitcoin-cli
      - name: Rename the executables
        run: |
          BIN="$GITHUB_WORKSPACE/release/bin"
          mkdir -p "$BIN"
          cp /c/b/build/bin/bitcoind.exe "$BIN/cachecoind.exe"
          cp /c/b/build/bin/bitcoin-cli.exe "$BIN/cachecoin-cli.exe"
          ls -la "$BIN"
      - name: Set the product name and icon on the executables
        # Resource-only: Task Manager and Explorer show the project's product name and icon.
        # This does not touch code or consensus bytes; the patch fingerprint is
        # unchanged. The binaries are already stripped and timestamp-neutral (linker flags).
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/brand_windows_exe.ps1 -Exe "$env:GITHUB_WORKSPACE\release\bin\cachecoind.exe" -Icon assets\logo.ico -FileDescription "CacheCoin node (cachecoind)" -OriginalFilename "cachecoind.exe"
          pwsh -NoProfile -File scripts/brand_windows_exe.ps1 -Exe "$env:GITHUB_WORKSPACE\release\bin\cachecoin-cli.exe" -Icon assets\logo.ico -FileDescription "CacheCoin RPC client (cachecoin-cli)" -OriginalFilename "cachecoin-cli.exe"
      - name: Assert the product metadata took effect
        # The step above must actually set the product name and icon on the
        # executables. A green job whose binaries still carry the upstream
        # version resources is the failure this asserts against: the package
        # says in PROVENANCE.txt that it carries the project's metadata.
        shell: pwsh
        run: |
          $bad = @()
          foreach ($name in @('cachecoind.exe','cachecoin-cli.exe')) {
            $p = Join-Path "$env:GITHUB_WORKSPACE\release\bin" $name
            $v = (Get-Item -LiteralPath $p).VersionInfo
            if ($v.ProductName -ne 'CacheCoin' -or $v.FileDescription -notlike 'CacheCoin*') {
              $bad += "$name ProductName='$($v.ProductName)' FileDescription='$($v.FileDescription)'"
            }
          }
          if ($bad.Count -gt 0) { Write-Error ("product metadata missing: " + ($bad -join '; ')); exit 1 }
          Write-Output "product metadata verified on cachecoind.exe and cachecoin-cli.exe"
      - name: Assert static runtime and test the packaged folder with a clean PATH
        # Two checks the old job lacked:
        # 1. No imported DLL may exist in /mingw64/bin. The build links SQLite,
        #    Boost, libevent and the MinGW runtime statically; if any becomes
        #    dynamic again, this fails instead of shipping an unlisted DLL.
        # 2. Run the executables from the packaged folder with the MSYS2 path
        #    removed, create a wallet and mine a regtest block. This is the only
        #    check that proves the folder works on a machine without MSYS2.
        run: |
          BIN="$GITHUB_WORKSPACE/release/bin"
          cd "$BIN"
          for exe in cachecoind.exe cachecoin-cli.exe; do
            imports="$(objdump -p "$exe" | awk '/DLL Name:/ {print $3}' | sort -u)" || { echo "objdump failed on $exe"; exit 1; }
            for dll in $imports; do
              if [ -f "/mingw64/bin/$dll" ]; then echo "non-system import in $exe: $dll"; exit 1; fi
            done
          done
          echo "no non-system DLL imports"
          ./cachecoind.exe --version
          ./cachecoin-cli.exe --version
          D="$(mktemp -d)"
          DW="$(cygpath -w "$D")"
          CP="/c/Windows/System32:/c/Windows"
          PATH="$CP" ./cachecoind.exe -regtest -datadir="$DW" -rpcuser=u -rpcpassword=p \
              -rpcport=39932 -port=39933 -listen=0 -printtoconsole=0 &
          BPID=$!
          cli() { PATH="$CP" ./cachecoin-cli.exe -regtest -datadir="$DW" -rpcuser=u -rpcpassword=p -rpcport=39932 "$@"; }
          for i in $(seq 1 60); do cli getblockchaininfo >/dev/null 2>&1 && break; sleep 2; done
          GENESIS="$(cli getblockhash 0)"
          echo "genesis: $GENESIS"
          # Regtest keeps Bitcoin's regtest genesis (patch 0002 only replaces the
          # mainnet one); 1bc3387d... is the mainnet genesis, checked elsewhere.
          test "$GENESIS" = "0f9188f13cb7b2c71f2a335e3a4fc328bf5beb436012afca590b1a11466e2206"
          cli createwallet w
          ADDR="$(cli -rpcwallet=w getnewaddress "" bech32)"
          cli -rpcwallet=w generatetoaddress 1 "$ADDR"
          H="$(cli getblockcount)"
          echo "regtest height: $H"
          test "$H" = "1"
          cli stop
          wait $BPID || true
          rm -rf "$D"
          sha256sum -- *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cachecoin-windows
          path: release/
