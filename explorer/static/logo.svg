<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    
    <!-- Outer Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Coin Outer Border -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="16"/>
  <circle cx="256" cy="256" r="216" fill="none" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Inner Medallion -->
  <circle cx="256" cy="256" r="200" fill="#0b1120" stroke="#1e293b" stroke-width="6"/>

  <!-- Silicon Cache Circuit Decorative Traces -->
  <g stroke="#06b6d4" stroke-opacity="0.4" stroke-width="2" fill="none">
    <path d="M120 256 H80"/>
    <path d="M392 256 H432"/>
    <path d="M256 120 V80"/>
    <path d="M256 392 V432"/>
    <circle cx="80" cy="256" r="4" fill="#06b6d4"/>
    <circle cx="432" cy="256" r="4" fill="#06b6d4"/>
    <circle cx="256" cy="80" r="4" fill="#06b6d4"/>
    <circle cx="256" cy="432" r="4" fill="#06b6d4"/>
  </g>

  <!-- Glowing Emblem Letter "C" (Stylized CPU Cache Memory Cell) -->
  <path d="M 330 160 
           L 220 160 
           A 96 96 0 0 0 220 352 
           L 330 352 
           L 330 312 
           L 230 312 
           A 56 56 0 0 1 230 200 
           L 330 200 Z" 
        fill="url(#neonCyan)" 
        filter="url(#glow)"/>

  <!-- Center Microchip Node Inlay -->
  <rect x="236" y="236" width="40" height="40" rx="8" fill="#090d16" stroke="#22d3ee" stroke-width="3"/>
  <circle cx="256" cy="256" r="6" fill="#10b981"/>
</svg>
